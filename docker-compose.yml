services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Loads APP_ENV/PORT/LOG_LEVEL/API keys/models straight from .env — defaults for
    # all of those already live in src/infrastructure/helpers/config, so they don't
    # need to be repeated here.
    env_file: .env
    environment:
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store data in a version-specific subdir; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-secondbrain}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
